name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0
          run_install: false
          cache: false
      - name: Verify version
        shell: powershell
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne ('v' + $version)) { throw 'Tag and package.json version differ.' }
      - name: Test and build the installer
        shell: powershell
        run: .\scripts\Build.ps1 -Package
      - name: Publish release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $savedPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          try {
            gh release view $env:GITHUB_REF_NAME --json tagName --repo $env:GITHUB_REPOSITORY 2>$null
            $releaseExists = $LASTEXITCODE -eq 0
          } finally {
            $ErrorActionPreference = $savedPreference
          }
          if ($releaseExists) {
            Write-Host 'This release was already published; existing assets are preserved.'
            exit 0
          }
          $assets = @(Get-ChildItem out -File | Where-Object { $_.Name -match '\.(zip|sha256)$' } | ForEach-Object { $_.FullName })
          gh release create $env:GITHUB_REF_NAME @assets --title ('WinYandexMusicRPC for Vencord ' + $env:GITHUB_REF_NAME) --notes-file docs/RELEASE.md --verify-tag --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
